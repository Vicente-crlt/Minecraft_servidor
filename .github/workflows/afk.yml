name: Minecraft Bedrock NPC Bot

on: workflow_dispatch: push:
branches: - main

jobs: run-bot: runs-on: ubuntu-latest
steps: - name: Clonar repositorio
uses: actions/checkout@v4

  - name: Configurar Node.js
    uses: 
actions/setup-node@v4
    with:
      node-version: 20

  - name: Instalar 
dependencias
    run: |
      npm init -y
      npm install 
bedrock-protocol

  - name: Ejecutar script del 
NPC
    run: node bot.js
